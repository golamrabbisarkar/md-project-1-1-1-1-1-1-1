name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get Date
        id: get-date
        run: echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}

      - name: Cache Buildozer project directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ runner.os }}-${{ steps.get-date.outputs.date }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev
          pip install --upgrade pip buildozer cython

      - name: Generate buildozer.spec if not exists
        run: |
          rm -f buildozer.spec
          if [ ! -f buildozer.spec ]; then
            echo "buildozer.spec পাওয়া যায়নি, নতুন ফাইল তৈরি করা হচ্ছে..."
            buildozer init
            # আপনার অ্যাপের প্রধান ফাইল অনুসারে নাম বা প্রয়োজনীয় প্যাকেজ সেট করতে পারেন:
            sed -i 's/title = My Application/title = My Kivy App/' buildozer.spec
            sed -i 's/package.name = myapp/package.name = mykivyapp/' buildozer.spec
            sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
          else
            echo "বিদ্যমান buildozer.spec ফাইল ব্যবহার করা হচ্ছে।"
          fi

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
